<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identity Verification — SecureAccess</title>
<link rel="stylesheet" href="../style/shared.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card fade-in">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:32px;">
      <div style="width:44px;height:44px;border-radius:12px;background:var(--c-indigo-d);display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      </div>
      <div>
        <p style="font-size:16px;font-weight:800;color:#fff;margin:0;">SecureAccess</p>
        <p style="font-size:11px;color:var(--c-500);margin:2px 0 0;">Identity Verification</p>
      </div>
    </div>

    <!-- Step indicator -->
    <div style="display:flex;align-items:center;gap:0;margin-bottom:28px;">
      <div style="display:flex;align-items:center;flex-direction:column;gap:4px;">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--c-indigo);display:flex;align-items:center;justify-content:center;">
          <svg width="14" height="14" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
        </div>
        <span style="font-size:10px;color:var(--c-500);">Login</span>
      </div>
      <div style="flex:1;height:2px;background:var(--c-indigo);margin:0 8px 20px;"></div>
      <div style="display:flex;align-items:center;flex-direction:column;gap:4px;">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--c-indigo);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(99,102,241,.2);">
          <span style="font-size:12px;font-weight:700;color:#fff;">2</span>
        </div>
        <span style="font-size:10px;color:var(--c-indigo-l);">Verify</span>
      </div>
      <div style="flex:1;height:2px;background:var(--c-800);margin:0 8px 20px;"></div>
      <div style="display:flex;align-items:center;flex-direction:column;gap:4px;">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--c-800);border:2px solid var(--c-700);display:flex;align-items:center;justify-content:center;">
          <span style="font-size:12px;font-weight:700;color:var(--c-500);">3</span>
        </div>
        <span style="font-size:10px;color:var(--c-600);">Access</span>
      </div>
    </div>

    <h2 style="font-size:20px;font-weight:800;color:#fff;margin:0 0 6px;">Identity Verification</h2>
    <p style="font-size:13px;color:var(--c-500);margin:0 0 24px;">We sent a 6-digit OTP to your registered email (<strong style="color:var(--c-400);">a***@university.edu</strong>). Enter it below to verify your identity.</p>

    <!-- OTP boxes -->
    <div style="display:flex;gap:10px;margin-bottom:24px;justify-content:center;" id="otp-wrap">
      <input class="otp-box" type="text" maxlength="1" id="otp0" oninput="otpInput(0)" onkeydown="otpKey(event,0)">
      <input class="otp-box" type="text" maxlength="1" id="otp1" oninput="otpInput(1)" onkeydown="otpKey(event,1)">
      <input class="otp-box" type="text" maxlength="1" id="otp2" oninput="otpInput(2)" onkeydown="otpKey(event,2)">
      <input class="otp-box" type="text" maxlength="1" id="otp3" oninput="otpInput(3)" onkeydown="otpKey(event,3)">
      <input class="otp-box" type="text" maxlength="1" id="otp4" oninput="otpInput(4)" onkeydown="otpKey(event,4)">
      <input class="otp-box" type="text" maxlength="1" id="otp5" oninput="otpInput(5)" onkeydown="otpKey(event,5)">
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
      <span style="font-size:12px;color:var(--c-600);">Expires in <strong id="timer" style="color:var(--c-amber);">4:58</strong></span>
      <button onclick="resendOtp()" style="background:none;border:none;color:var(--c-indigo-l);font-size:12px;cursor:pointer;font-family:inherit;" id="resend-btn">Resend OTP</button>
    </div>

    <div id="otp-error" style="display:none;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:8px;padding:10px 14px;margin-bottom:16px;color:var(--c-red);font-size:13px;"></div>

    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;" onclick="verifyOtp()" id="verify-btn">
      <span id="vbtn-text">Verify Identity</span>
    </button>

    <button onclick="window.location.href='login.html'" style="display:block;width:100%;text-align:center;background:none;border:none;color:var(--c-600);font-size:12px;margin-top:16px;cursor:pointer;font-family:inherit;">← Back to Sign In</button>
  </div>
</div>

<style>
.otp-box {
  width: 50px; height: 54px;
  background: var(--c-800);
  border: 2px solid var(--c-700);
  border-radius: 10px;
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  outline: none;
  transition: border-color .15s;
}
.otp-box:focus { border-color: var(--c-indigo); box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
</style>

<script>
var seconds = 298;
var timerEl = document.getElementById('timer');
var interval = setInterval(function () {
  seconds--;
  if (seconds <= 0) { clearInterval(interval); timerEl.textContent = '0:00'; return; }
  var m = Math.floor(seconds / 60);
  var s = seconds % 60;
  timerEl.textContent = m + ':' + (s < 10 ? '0' : '') + s;
}, 1000);

function otpInput(i) {
  var v = document.getElementById('otp' + i).value;
  if (v && i < 5) document.getElementById('otp' + (i + 1)).focus();
}
function otpKey(e, i) {
  if (e.key === 'Backspace' && !document.getElementById('otp' + i).value && i > 0) {
    document.getElementById('otp' + (i - 1)).focus();
  }
}

function getOtp() {
  var s = '';
  for (var i = 0; i < 6; i++) s += document.getElementById('otp' + i).value;
  return s;
}

function resendOtp() {
  seconds = 298;
  for (var i = 0; i < 6; i++) document.getElementById('otp' + i).value = '';
  document.getElementById('otp0').focus();
  document.getElementById('otp-error').style.display = 'none';
}

function verifyOtp() {
  var otp = getOtp();
  var err = document.getElementById('otp-error');
  err.style.display = 'none';
  if (otp.length < 6) {
    err.textContent = 'Please enter all 6 digits of your OTP.';
    err.style.display = 'block';
    return;
  }
  document.getElementById('vbtn-text').textContent = 'Verifying…';
  document.getElementById('verify-btn').disabled = true;
  setTimeout(function () { window.location.href = 'eligibility.html'; }, 900);
}
</script>
</body>
</html>
