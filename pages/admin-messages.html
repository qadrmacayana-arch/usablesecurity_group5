<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Admin Console</title>
<link rel="stylesheet" href="../style/shared.css">
</head>
<body data-admin-page="messages">
<div class="app-shell"><aside id="admin-sidebar"></aside><div class="main-area">
<div id="admin-top-bar" data-title="Messages"></div>
<div class="page-content fade-in">
  <div class="page-header"><h1>Message history</h1><p>Messages sent to students as part of request decisions.</p></div>
  <div class="card" style="max-width:960px;margin-top:22px;"><div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;"><div class="avatar">AC</div><div><h2 style="font-size:15px;color:#fff;margin:0;">Alexandra Chen</h2><p style="font-size:12px;color:var(--c-500);margin:2px 0 0;">STU-2024-0847 · Network Security Lab request</p></div></div><div style="display:flex;gap:10px;margin-top:18px;"><textarea id="student-message" class="textarea" placeholder="Send an update or request more information..." style="min-height:62px;"></textarea><button class="btn btn-primary" onclick="sendStudentMessage()" style="align-self:flex-end;" id="send-message-btn">Send</button></div><p id="message-error" style="display:none;color:var(--c-red);font-size:12px;margin:7px 0 0;">Type a message first.</p><div id="admin-message-list" style="margin-top:12px;"></div></div>
</div></div></div>
<script src="../script/admin-shared.js"></script><script src="../script/pages/admin-messages.js"></script>
</body></html>
